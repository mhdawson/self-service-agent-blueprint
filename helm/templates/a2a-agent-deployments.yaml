{{- if .Values.a2aAgents.enabled }}
{{- $fullName := include "self-service-agent.fullname" . -}}
{{- $root := . -}}

{{/* Discover all agent card files from helm/a2a-agents directory */}}
{{- range $path, $_ := .Files.Glob "a2a-agents/*-card.json" }}
{{/* Extract agent name from filename (remove -card.json suffix) */}}
{{- $filename := base $path }}
{{- $agentName := trimSuffix "-card.json" $filename }}

{{/* Get optional overrides from values.yaml, or use empty dict */}}
{{- $agentConfig := index ($root.Values.a2aAgents.agents | default dict) $agentName | default dict }}

{{/* Apply smart defaults */}}
{{- $defaultImage := printf "self-service-agent-%s" $agentName }}
{{- $image := $agentConfig.image | default $defaultImage }}
{{- $port := $agentConfig.port | default 8001 }}
{{- $replicas := $agentConfig.replicas | default 1 }}
{{- $defaultResources := dict "requests" (dict "memory" "512Mi" "cpu" "250m") "limits" (dict "memory" "1Gi" "cpu" "500m") }}
{{- $resources := $agentConfig.resources | default $defaultResources }}
{{- $env := $agentConfig.env | default list }}
{{- $uvicornWorkers := $agentConfig.uvicornWorkers }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-a2a-{{ $agentName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "self-service-agent.labels" $root | nindent 4 }}
    app: {{ $fullName }}-a2a-{{ $agentName }}
    component: a2a-agent
    a2a-agent: {{ $agentName | quote }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      {{- include "self-service-agent.selectorLabels" $root | nindent 6 }}
      app: {{ $fullName }}-a2a-{{ $agentName }}
  template:
    metadata:
      labels:
        {{- include "self-service-agent.labels" $root | nindent 8 }}
        app: {{ $fullName }}-a2a-{{ $agentName }}
        component: a2a-agent
        a2a-agent: {{ $agentName | quote }}
    spec:
      serviceAccountName: {{ include "self-service-agent.serviceAccountName" $root }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: {{ $agentName }}
        image: "{{ $root.Values.image.registry }}/{{ $image }}:{{ $root.Values.image.tag | default $root.Chart.AppVersion }}"
        imagePullPolicy: {{ $root.Values.image.pullPolicy }}
        ports:
        - containerPort: {{ $port }}
          protocol: TCP
          name: http
        env:
        {{- if $uvicornWorkers }}
        - name: UVICORN_WORKERS
          value: {{ $uvicornWorkers | quote }}
        {{- end }}
        {{- range $env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        resources:
          {{- toYaml $resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /health
            port: {{ $port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: {{ $port }}
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: {{ $port }}
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-a2a-{{ $agentName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "self-service-agent.labels" $root | nindent 4 }}
    app: {{ $fullName }}-a2a-{{ $agentName }}
    component: a2a-agent
    a2a-agent: {{ $agentName | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "self-service-agent.selectorLabels" $root | nindent 4 }}
    app: {{ $fullName }}-a2a-{{ $agentName }}
  ports:
  - name: http
    port: 80
    targetPort: {{ $port }}
    protocol: TCP
{{- end }}
{{- end }}
